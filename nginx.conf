server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache off;
        proxy_buffering off;

        # 排課 / 首次檢索(載入 ~2GB vectorstore.pkl)可能跑上百秒,
        # nginx 預設 proxy_read_timeout 60s 會在 agent 還在跑時就掐斷 SSE
        # (log 會出現 "upstream timed out")。設得比 harness 的
        # DEFAULT_TIMEOUT_SEC 寬鬆,讓逾時由後端決定並回友善訊息。
        #
        # 2026-08-08 300s → 1200s。本機 CPU-only 推論下單次 LLM 呼叫要 66~196s
        # (見 harness/agent_wrapper.py 的 DEFAULT_TIMEOUT_SEC 註解)。實測查課
        # 一題 2m49s、排課要走 3~4 個工具會更久。harness 放寬到 900s,這裡必須
        # 更寬,否則 nginx 會先掐斷,前端只會顯示
        # "An error occurred while attempting to connect."(見 Chat.vue 的
        # error watcher),而不是後端的友善逾時訊息。
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_connect_timeout 75s;
    }
}
