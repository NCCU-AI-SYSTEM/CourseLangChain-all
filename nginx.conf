server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache off;
        proxy_buffering off;

        # 排課 / 首次檢索(載入 ~2GB vectorstore.pkl)可能跑上百秒,
        # nginx 預設 proxy_read_timeout 60s 會在 agent 還在跑時就掐斷 SSE
        # (log 會出現 "upstream timed out")。設得比 harness 的
        # DEFAULT_TIMEOUT_SEC=120 寬鬆,讓逾時由後端決定並回友善訊息。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
